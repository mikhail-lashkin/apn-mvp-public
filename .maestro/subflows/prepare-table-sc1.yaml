appId: com.aipoker.notes
---
- runFlow: launch-dev-client.yaml

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 120000
    optional: true

- runFlow:
    when:
      visible:
        id: "login-email"
    file: login.yaml

# Бывший пресет sc1: создаём 8-max через SetupSheet (дефолт лобби)
- runFlow: open-new-table.yaml

- scrollUntilVisible:
    element:
      id: "reset-table-local"
    direction: DOWN
    timeout: 15000

- runFlow: reset-app-sc1.yaml
