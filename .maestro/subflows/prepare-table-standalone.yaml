appId: com.aipoker.notes
---
- runFlow: launch-standalone.yaml

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 60000
    optional: true

- runFlow:
    when:
      visible:
        id: "login-email"
    file: login.yaml

- runFlow: open-new-table.yaml

- runFlow: reset-app.yaml
